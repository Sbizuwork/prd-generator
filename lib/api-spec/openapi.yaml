openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: prd
    description: PRD generation
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /prd/generate:
    post:
      operationId: generatePrd
      tags: [prd]
      summary: Generate a drafted, critiqued, and revised PRD
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GeneratePrdInput"
      responses:
        "200":
          description: Generated PRD passes
          content:
            application/json:
              schema:
                  $ref: "#/components/schemas/GeneratePrdResult"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: OpenRouter request failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    GeneratePrdInput:
      type: object
      properties:
        idea:
          type: string
          minLength: 3
          maxLength: 280
        targetUser:
          type: string
          maxLength: 160
      required:
        - idea
    GeneratePrdResult:
      type: object
      properties:
        draft:
          type: string
        critique:
          type: string
        revised:
          type: string
        mode:
          type: string
          enum: [demo, live]
      required:
        - draft
        - critique
        - revised
        - mode
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

